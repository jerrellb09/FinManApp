server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs

      - json:
          source: attrs
          expressions:
            tag: tag

      - regex:
          expression: (?P<container_name>(?:[^|]*))
          source: tag

      - timestamp:
          source: time
          format: RFC3339Nano

      - labels:
          stream:
          container_name:

      - match:
          selector: '{container_name="finmanapp"}'
          stages:
          - json:
              expressions:
                level: level
                message: message
                logger: logger_name
                thread: thread_name
                timestamp: "@timestamp"
                trace_id: 
                span_id:
          - labels:
              level:
              logger:
              thread: